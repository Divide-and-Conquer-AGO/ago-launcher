# Use the following for linting: https://rhysd.github.io/actionlint/
name: Build DAC Launcher

on:
  push:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # It runs on every commit pushed to GitHub
  build-ago-launcher:
    runs-on: windows-latest
    # Steps
    steps:
      - uses: actions/checkout@v4

      - name: "Install go 1.24.4"
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.4' 

      - name: "Install Fyne"
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: "Build DAC Launcher"
        run: cd src && fyne package -release -os windows

      - name: "Prepare Nightly Binary"
        shell: pwsh
        run: |
          Copy-Item -Path "src/DAC_Launcher.exe" -Destination "src/DAC_Launcher_nightly.exe" -Force

      - name: "Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "DAC-Launcher-latest-build-${{ github.workflow_sha }}"
          path: src/DAC_Launcher.exe

      - name: "Create or Update Nightly Release"
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: DAC Launcher Nightly
          body: |
            Automated nightly build.

            - Commit: ${{ github.sha }}
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          artifacts: src/DAC_Launcher.exe
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true